name: Manifest Provider Removal Test

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "owner/repo holding the split APKs"
        required: true
        default: "instafel/source-apks"
      release_tag:
        description: "Release tag (leave blank for latest)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install lxml
        run: |
          pip install lxml --quiet

      - name: Download split APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p splits

          if [ -n "${{ inputs.release_tag }}" ]; then
            gh release download "${{ inputs.release_tag }}" \
              --repo "${{ inputs.source_repo }}" \
              --dir splits \
              --pattern "*.apk"
          else
            gh release download \
              --repo "${{ inputs.source_repo }}" \
              --dir splits \
              --pattern "*.apk"
          fi

          echo "Downloaded APKs:"
          ls -lah splits

      - name: Download APKEditor
        run: |
          API_URL="https://api.github.com/repos/REAndroid/APKEditor/releases/latest"
          ASSET_URL=$(curl -s "$API_URL" | grep "browser_download_url.*\.jar" | cut -d '"' -f4)
          wget -q "$ASSET_URL" -O APKEditor.jar

      - name: Merge split APKs
        run: |
          java -jar APKEditor.jar m \
            -i splits \
            -o merged.apk

      - name: Download Apktool 3.0.3
        run: |
          wget -q \
          https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
          -O apktool.jar

      - name: Decode merged APK
        run: |
          java -jar apktool.jar d merged.apk -o decoded -f

      - name: Run Test Patch
        run: |
          java test.java decoded

      - name: Run Test Patch
        run: |
          java ads.java decoded

      - name: Recompile (Force AAPT1)
        run: |
          java -jar apktool.jar b decoded \
            -o rebuilt.apk

      - name: Delete previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete provider-removal-test -y || true
          git push origin :refs/tags/provider-removal-test || true

      # ---------------------------------
      # CREATE RELEASE
      # ---------------------------------
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: provider-removal-test
          name: Provider Removal Test
          body: |
            Rebuilt APK after removing:
            com.facebook.pages.app.ig4work.tokenhandoff
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------
      # WAIT FOR RELEASE
      # ---------------------------------
      - name: Wait for GitHub Release
        shell: bash
        run: |
          echo "⏳ Waiting for GitHub release to become available..."
          sleep 10

      # ---------------------------------
      # UPLOAD APK
      # ---------------------------------
      - name: Upload rebuilt APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "⬆️ Uploading rebuilt.apk..."

          success=false

          for attempt in 1 2 3 4 5; do
            echo "🔄 Upload attempt ${attempt}/5..."

            if gh release upload \
              provider-removal-test \
              rebuilt.apk \
              --clobber; then

              echo "✅ rebuilt.apk uploaded successfully."
              success=true
              break
            fi

            echo "⚠️ Upload failed. Waiting 10 seconds before retry..."
            sleep 10
          done

          if [ "$success" != true ]; then
            echo "❌ Failed to upload rebuilt.apk after 5 attempts."
            exit 1
          fi

          echo "🎉 Provider Removal Test release published successfully."